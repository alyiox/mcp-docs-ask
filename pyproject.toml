[project]
name = "mcp-docs-ask"
version = "0.2.0"
description = "MCP server for local retrieval over markdown documentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0",
    "numpy>=2.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
mcp-docs-ask = "mcp_docs_ask.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_docs_ask"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
